<!-- templates/login.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Login - ToDo</title>
  <style>
    body { font-family: Arial, sans-serif; display:flex; height:100vh; justify-content:center; align-items:center; background: #f0f4f8; }
    .card { background:white; padding:24px; border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,0.08); }
    input { padding:10px; width:220px; margin-right:8px; border-radius:6px; border:1px solid #ddd; }
    button { padding:10px 14px; border:none; background:#66a6ff; color:white; border-radius:6px; cursor:pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h3>Welcome — enter your name</h3>
    <form method="POST">
      <input name="username" placeholder="Your name" required>
      <button type="submit">Enter</button>
    </form>
    <p style="font-size:0.9rem;color:#666;margin-top:10px;">No password — just type a name to test multi-user data.</p>
  </div>
</body>
</html>
